services:
  db:
    image: postgres:16-alpine
    container_name: cohort-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - cohort_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cohort_db_data:
    name: cohort_db_data
