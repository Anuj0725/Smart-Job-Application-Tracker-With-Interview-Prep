server:
  port: 8080

spring:
  application:
    name: cohort-api
  jackson:
    # The API contract is snake_case, so map it globally.
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # Above the 5 MB resume cap, so the size check in ValidatingFileStorage gives the error.
      max-file-size: 6MB
      max-request-size: 7MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
